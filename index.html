<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div class="todo-container">

    <h1>My To-Do List</h1>

    <p class="subtitle">Stay focused. Get things done.</p>

    <div class="date-time">
    <span id="currentDate"></span>
    <span id="currentTime"></span>
</div>

    <div class="stats">
        <div class="stat-box">
            <span id="totalStat">0</span>
            <p>Total</p>
        </div>
        <div class="stat-box">
            <span id="activeStat">0</span>
            <p>Active</p>
        </div>
        <div class="stat-box">
            <span id="completedStat">0</span>
            <p>Completed</p>
        </div>
    </div>

    <div class="input">
        <input type="text" id="taskInput" placeholder="Enter a task">
        <button id="add">Add Task</button> 
    </div>

    <p id="taskCount">Tasks: 0</p>
    <div class="filters">
    <button id="allBtn">All</button>
    <button id="activeBtn">Active</button>
    <button id="completedBtn">Completed</button>
</div>
    <ul id="taskList"></ul>
     <script src="script.js"></script>

</div>
</body>
</html>
